<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>档案装盒编目与库位盘点系统</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="topbar-brand">
      <div class="logo">档</div>
      <h1>档案装盒编目与库位盘点系统</h1>
    </div>
    <div class="topbar-user">
      <span class="role-badge" id="current-role">管理员</span>
      <select id="user-select" onchange="switchUser()">
        <option value="admin">admin (管理员)</option>
        <option value="archivist">archivist (档案员)</option>
        <option value="reader">reader (查阅者)</option>
      </select>
    </div>
  </header>

  <div class="layout">
    <!-- 侧边导航 -->
    <aside class="sidebar">
      <nav>
        <button class="nav-item active" data-view="catalog" onclick="switchView('catalog')">
          <span class="icon">📋</span> 案卷编目
        </button>
        <button class="nav-item" data-view="boxing" onclick="switchView('boxing')">
          <span class="icon">📦</span> 装盒清单
        </button>
        <button class="nav-item" data-view="locations" onclick="switchView('locations')">
          <span class="icon">🗺️</span> 库位地图
        </button>
        <button class="nav-item" data-view="inventory" onclick="switchView('inventory')">
          <span class="icon">🔍</span> 盘点任务
        </button>
        <button class="nav-item" data-view="borrowing" onclick="switchView('borrowing')">
          <span class="icon">📤</span> 借阅审批
        </button>
        <button class="nav-item" data-view="differences" onclick="switchView('differences')">
          <span class="icon">⚠️</span> 差异处理
        </button>
      </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content" id="main-content">
      <!-- 视图由 JS 动态渲染 -->
    </main>
  </div>

  <!-- 模态框容器 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content">
      <!-- 模态框内容由 JS 填充 -->
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
